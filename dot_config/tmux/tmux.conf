# vi mode
setw -g mode-keys vi

# enable mouse
set -g mouse on
bind-key -T edit-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T edit-mode-vi WheelDownPane send-keys -X scroll-down

# horizontal split
bind | split-window -h -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
# vertical split
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# moving between panes with vi style
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# adjust panes even-horizontal
bind = select-layout even-horizontal

# reload config
bind-key -T prefix r source-file ~/.config/tmux/tmux.conf \; display-message 'Configuration reloaded.'

# appearance
# set -g default-terminal 'screen-256color'
# set -g terminal-overrides 'xterm:colors=256'
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",*256col*:Tc"

set -g status-bg "#1c1c1c"
set -g status-fg "#ffffff"

set-option -g window-style 'bg=#101010'
# set-window-option -g window-cursor-style line

set -g status-justify 

# minimal tmux configuration
set -g @minimal-tmux-use-arrow true
set -g @minimal-tmux-right-arrow ""
set -g @minimal-tmux-left-arrow ""

set -g @minimal-tmux-bg "#1446c7"
set -g @minimal-tmux-fg "#ffffff"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'niksingh710/minimal-tmux-status'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
